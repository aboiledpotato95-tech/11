name: Deploy cloud
on:
  workflow_dispatch:
jobs:
  cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the free D1 database and link it
        working-directory: cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler d1 create quickans-db || true
          ID=$(npx --yes wrangler d1 info quickans-db --json | python3 -c "import sys,json;print(json.load(sys.stdin)['uuid'])")
          printf '\n[[d1_databases]]\nbinding = "DB"\ndatabase_name = "quickans-db"\ndatabase_id = "%s"\n' "$ID" >> wrangler.toml
      - uses: cloudflare/wrangler-action@v3
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloud
          secrets: |
            QA_KEY
        env:
          QA_KEY: ${{ secrets.CLOUD_KEY }}
      - name: Show the cloud address
        run: echo "Cloud address - ${{ steps.deploy.outputs.deployment-url }}" | tee -a "$GITHUB_STEP_SUMMARY"
